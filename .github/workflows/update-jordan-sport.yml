name: Update Jordan Sport Streams

on:
  workflow_dispatch:

  schedule:
    # Every 3 hours.
    # GitHub cron schedules use UTC by default.
    - cron: "23 */3 * * *"

permissions:
  contents: read

concurrency:
  group: update-jordan-sport
  cancel-in-progress: true

jobs:
  update:
    name: Refresh Jordan Sport 1 and 2

    runs-on: ubuntu-latest

    timeout-minutes: 10

    env:
      WORKER_UPDATE_URL: ${{ secrets.WORKER_UPDATE_URL }}
      WORKER_UPDATE_SECRET: ${{ secrets.WORKER_UPDATE_SECRET }}

    steps:

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install requests
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install requests


      # ============================================================
      # REFRESH BOTH CHANNELS
      #
      # 1424 -> jordan_sport_1
      # 1425 -> jordan_sport_2
      #
      # IMPORTANT:
      #
      # Each channel is handled independently.
      #
      # If 1424 fails:
      #   jordan_sport_1 remains unchanged in KV.
      #
      # If 1425 succeeds:
      #   jordan_sport_2 is still updated.
      #
      # Roya / Roya News / Al Mamlaka / Day3a are never included
      # in the POST payload and therefore remain untouched.
      # ============================================================

      - name: Fetch, test and update Jordan Sport streams
        shell: bash

        run: |
          set -e

          python - <<'PY'

          import base64
          import json
          import os
          import sys
          import time

          from urllib.parse import (
              parse_qs,
              urlparse,
          )

          import requests


          # ========================================================
          # CONFIGURATION
          # ========================================================

          API_BASE = (
              "http://def.yacinelive.com"
          )


          BASE_KEY = (
              "c!xZj+N9&G@Ev@vw"
          )


          CHANNELS = [
              {
                  "channel_id": 1424,
                  "worker_key": "jordan_sport_1",
                  "display_name": "Jordan Sport 1",
              },
              {
                  "channel_id": 1425,
                  "worker_key": "jordan_sport_2",
                  "display_name": "Jordan Sport 2",
              },
          ]


          WORKER_UPDATE_URL = (
              os.environ.get(
                  "WORKER_UPDATE_URL",
                  ""
              ).strip()
          )


          WORKER_UPDATE_SECRET = (
              os.environ.get(
                  "WORKER_UPDATE_SECRET",
                  ""
              ).strip()
          )


          # ========================================================
          # BASIC CONFIG CHECK
          # ========================================================

          if not WORKER_UPDATE_URL:

              raise SystemExit(
                  "ERROR: "
                  "WORKER_UPDATE_URL secret is missing."
              )


          if not WORKER_UPDATE_SECRET:

              raise SystemExit(
                  "ERROR: "
                  "WORKER_UPDATE_SECRET secret is missing."
              )


          parsed_worker_url = (
              urlparse(
                  WORKER_UPDATE_URL
              )
          )


          if (
              parsed_worker_url.scheme
              !=
              "https"
          ):

              raise SystemExit(
                  "ERROR: "
                  "WORKER_UPDATE_URL must use HTTPS."
              )


          # ========================================================
          # HTTP SESSION
          # ========================================================

          session = requests.Session()


          session.headers.update({
              "Accept":
                  "application/json",

              "User-Agent":
                  "okhttp/4.12.0",
          })


          # ========================================================
          # DECODE API RESPONSE
          # ========================================================

          def decode_api_response(
              response
          ):

              timestamp = (
                  response.headers.get(
                      "T"
                  )
                  or
                  response.headers.get(
                      "t"
                  )
              )


              if not timestamp:

                  raise RuntimeError(
                      "Yacine API response "
                      "did not contain the T header."
                  )


              encoded = (
                  response.text.strip()
              )


              if not encoded:

                  raise RuntimeError(
                      "Yacine API returned "
                      "an empty response."
                  )


              try:

                  encrypted = (
                      base64.b64decode(
                          encoded,
                          validate=True
                      )
                  )

              except Exception as exc:

                  raise RuntimeError(
                      "Could not Base64-decode "
                      "Yacine API response."
                  ) from exc


              key = (
                  BASE_KEY
                  +
                  timestamp
              ).encode(
                  "utf-8"
              )


              if not key:

                  raise RuntimeError(
                      "Decoder key is empty."
                  )


              decrypted = bytes(

                  byte
                  ^
                  key[
                      index
                      %
                      len(key)
                  ]

                  for index, byte
                  in enumerate(
                      encrypted
                  )
              )


              try:

                  text = (
                      decrypted.decode(
                          "utf-8"
                      )
                  )


                  payload = (
                      json.loads(
                          text
                      )
                  )

              except Exception as exc:

                  raise RuntimeError(
                      "Decoded API response "
                      "was not valid JSON."
                  ) from exc


              return payload


          # ========================================================
          # GET A FRESH CHANNEL RESPONSE
          # ========================================================

          def get_channel_data(
              channel_id
          ):

              api_url = (
                  f"{API_BASE}"
                  f"/api/channel/"
                  f"{channel_id}"
              )


              response = (
                  session.get(
                      api_url,
                      timeout=30
                  )
              )


              response.raise_for_status()


              return (
                  decode_api_response(
                      response
                  )
              )


          # ========================================================
          # CHOOSE AN HLS STREAM FROM THE RESPONSE
          # ========================================================

          def choose_stream(
              payload
          ):

              streams = (
                  payload.get(
                      "data"
                  )
              )


              if not isinstance(
                  streams,
                  list
              ):

                  raise RuntimeError(
                      "API payload does not "
                      "contain a valid data list."
                  )


              if not streams:

                  raise RuntimeError(
                      "API returned no streams."
                  )


              candidates = []


              for stream in streams:

                  if not isinstance(
                      stream,
                      dict
                  ):

                      continue


                  stream_url = (
                      stream.get(
                          "url"
                      )
                  )


                  if (
                      not isinstance(
                          stream_url,
                          str
                      )
                  ):

                      continue


                  stream_url = (
                      stream_url.strip()
                  )


                  if (
                      ".m3u8"
                      not in
                      stream_url.lower()
                  ):

                      continue


                  candidates.append(
                      stream
                  )


              if not candidates:

                  raise RuntimeError(
                      "No HLS .m3u8 stream "
                      "was returned by the API."
                  )


              # Prefer entries named HD if available.

              candidates.sort(
                  key=lambda item:
                      (
                          str(
                              item.get(
                                  "name",
                                  ""
                              )
                          ).lower()
                          ==
                          "hd"
                      ),
                  reverse=True
              )


              return candidates[0]


          # ========================================================
          # VALIDATE RETURNED STREAM URL
          # ========================================================

          def validate_stream_url(
              stream_url
          ):

              parsed = (
                  urlparse(
                      stream_url
                  )
              )


              if (
                  parsed.scheme
                  not in (
                      "http",
                      "https"
                  )
              ):

                  raise RuntimeError(
                      "Unexpected stream protocol: "
                      f"{parsed.scheme}"
                  )


              if (
                  parsed.hostname
                  !=
                  "re.ycn-redirect.online"
              ):

                  raise RuntimeError(
                      "Unexpected stream hostname: "
                      f"{parsed.hostname}"
                  )


              if (
                  ".m3u8"
                  not in
                  parsed.path.lower()
              ):

                  raise RuntimeError(
                      "Returned URL is not "
                      "an M3U8 path."
                  )


              # ----------------------------------------------------
              # CHECK EXPIRY IF e= EXISTS
              # ----------------------------------------------------

              query = (
                  parse_qs(
                      parsed.query
                  )
              )


              expiry_values = (
                  query.get(
                      "e",
                      []
                  )
              )


              expiry = None


              if expiry_values:

                  try:

                      expiry = int(
                          expiry_values[0]
                      )

                  except (
                      TypeError,
                      ValueError
                  ):

                      raise RuntimeError(
                          "Stream contains an invalid "
                          "e= expiry value."
                      )


                  remaining = (
                      expiry
                      -
                      int(
                          time.time()
                      )
                  )


                  print(
                      "Token remaining:",
                      remaining,
                      "seconds"
                  )


                  # Do not replace a good KV value
                  # with a token that is nearly dead.

                  if remaining < 900:

                      raise RuntimeError(
                          "Returned token has less "
                          "than 15 minutes remaining."
                      )


              return expiry


          # ========================================================
          # BUILD HEADERS RETURNED BY API
          # ========================================================

          def get_stream_headers(
              stream
          ):

              headers = {}


              api_headers = (
                  stream.get(
                      "headers"
                  )
                  or
                  {}
              )


              if isinstance(
                  api_headers,
                  dict
              ):

                  for (
                      name,
                      value
                  ) in (
                      api_headers.items()
                  ):

                      if (
                          isinstance(
                              name,
                              str
                          )
                          and
                          isinstance(
                              value,
                              str
                          )
                          and
                          name.strip()
                          and
                          value.strip()
                      ):

                          headers[
                              name.strip()
                          ] = (
                              value.strip()
                          )


              referer = (
                  stream.get(
                      "referer"
                  )
              )


              if (
                  isinstance(
                      referer,
                      str
                  )
                  and
                  referer.strip()
              ):

                  headers.setdefault(
                      "Referer",
                      referer.strip()
                  )


              user_agent = (
                  stream.get(
                      "user_agent"
                  )
              )


              if (
                  isinstance(
                      user_agent,
                      str
                  )
                  and
                  user_agent.strip()
              ):

                  headers.setdefault(
                      "User-Agent",
                      user_agent.strip()
                  )


              return headers


          # ========================================================
          # TEST HLS URL
          # ========================================================

          def test_hls(
              stream_url,
              headers
          ):

              response = (
                  requests.get(
                      stream_url,

                      headers=
                          headers,

                      allow_redirects=
                          True,

                      timeout=
                          30,
                  )
              )


              response.raise_for_status()


              body = (
                  response.text
              )


              if (
                  "#EXTM3U"
                  not in
                  body[:8192]
              ):

                  raise RuntimeError(
                      "Stream responded, "
                      "but did not return "
                      "an HLS playlist."
                  )


              final_url = (
                  response.url
              )


              final_host = (
                  urlparse(
                      final_url
                  ).hostname
              )


              content_type = (
                  response.headers.get(
                      "Content-Type",
                      ""
                  )
              )


              print(
                  "HLS status:",
                  response.status_code
              )


              print(
                  "HLS final host:",
                  final_host
              )


              print(
                  "HLS content type:",
                  content_type
              )


              print(
                  "HLS CHECK: PASSED"
              )


              return True


          # ========================================================
          # UPDATE ONE KV KEY
          # ========================================================

          def update_worker(
              worker_key,
              stream_url
          ):

              payload = {
                  worker_key:
                      stream_url
              }


              response = (
                  requests.post(
                      WORKER_UPDATE_URL,

                      headers={
                          "Authorization":
                              (
                                  "Bearer "
                                  +
                                  WORKER_UPDATE_SECRET
                              ),

                          "Content-Type":
                              "application/json",
                      },

                      json=
                          payload,

                      timeout=
                          30,
                  )
              )


              print(
                  "Worker HTTP status:",
                  response.status_code
              )


              if not response.ok:

                  print(
                      "Worker response:"
                  )


                  print(
                      response.text
                  )


                  response.raise_for_status()


              try:

                  result = (
                      response.json()
                  )

              except Exception as exc:

                  raise RuntimeError(
                      "Worker returned "
                      "non-JSON response."
                  ) from exc


              updated = (
                  result.get(
                      "updated",
                      []
                  )
              )


              if (
                  worker_key
                  not in
                  updated
              ):

                  raise RuntimeError(
                      "Worker response did not "
                      f"confirm update of "
                      f"{worker_key}."
                  )


              print(
                  "WORKER UPDATE: PASSED"
              )


          # ========================================================
          # PROCESS ONE CHANNEL
          # ========================================================

          def process_channel(
              channel
          ):

              channel_id = (
                  channel[
                      "channel_id"
                  ]
              )


              worker_key = (
                  channel[
                      "worker_key"
                  ]
              )


              display_name = (
                  channel[
                      "display_name"
                  ]
              )


              print("")
              print("")
              print(
                  "======================================"
              )


              print(
                  display_name
              )


              print(
                  "Yacine channel ID:",
                  channel_id
              )


              print(
                  "Worker key:",
                  worker_key
              )


              print(
                  "======================================"
              )


              print("")
              print(
                  "1. Requesting fresh API data..."
              )


              payload = (
                  get_channel_data(
                      channel_id
                  )
              )


              print(
                  "API DECODE: PASSED"
              )


              print("")
              print(
                  "2. Selecting HLS stream..."
              )


              stream = (
                  choose_stream(
                      payload
                  )
              )


              stream_url = (
                  stream[
                      "url"
                  ].strip()
              )


              print(
                  "Stream name:",
                  stream.get(
                      "name",
                      "unknown"
                  )
              )


              print("")
              print(
                  "3. Validating URL..."
              )


              expiry = (
                  validate_stream_url(
                      stream_url
                  )
              )


              if expiry:

                  print(
                      "Token expiry Unix:",
                      expiry
                  )


              print(
                  "URL CHECK: PASSED"
              )


              print("")
              print(
                  "4. Testing actual HLS..."
              )


              headers = (
                  get_stream_headers(
                      stream
                  )
              )


              test_hls(
                  stream_url,
                  headers
              )


              print("")
              print(
                  "5. Updating Cloudflare KV..."
              )


              update_worker(
                  worker_key,
                  stream_url
              )


              print("")
              print(
                  "SUCCESS:",
                  display_name
              )


          # ========================================================
          # MAIN
          # ========================================================

          successes = []

          failures = []


          for channel in CHANNELS:

              try:

                  process_channel(
                      channel
                  )


                  successes.append({
                      "channel_id":
                          channel[
                              "channel_id"
                          ],

                      "worker_key":
                          channel[
                              "worker_key"
                          ],
                  })


              except Exception as exc:

                  failures.append({
                      "channel_id":
                          channel[
                              "channel_id"
                          ],

                      "worker_key":
                          channel[
                              "worker_key"
                          ],

                      "error":
                          str(
                              exc
                          ),
                  })


                  print("")
                  print(
                      "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
                  )


                  print(
                      "FAILED:",
                      channel[
                          "display_name"
                      ]
                  )


                  print(
                      str(
                          exc
                      )
                  )


                  print(
                      "Existing KV value was NOT changed."
                  )


                  print(
                      "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
                  )


          # ========================================================
          # SUMMARY
          # ========================================================

          print("")
          print("")
          print(
              "======================================"
          )


          print(
              "JORDAN SPORT REFRESH SUMMARY"
          )


          print(
              "======================================"
          )


          for item in successes:

              print(
                  "UPDATED:",
                  item[
                      "worker_key"
                  ],
                  "from channel",
                  item[
                      "channel_id"
                  ]
              )


          for item in failures:

              print(
                  "FAILED:",
                  item[
                      "worker_key"
                  ],
                  "from channel",
                  item[
                      "channel_id"
                  ],
                  "-",
                  item[
                      "error"
                  ]
              )


          print("")
          print(
              "Successful:",
              len(
                  successes
              )
          )


          print(
              "Failed:",
              len(
                  failures
              )
          )


          # ========================================================
          # FINAL RESULT
          # ========================================================

          if failures:

              print("")
              print(
                  "One or more channels failed."
              )


              print(
                  "Any successful channel was still "
                  "updated independently."
              )


              sys.exit(1)


          print("")
          print(
              "SUCCESS: "
              "Jordan Sport 1 and "
              "Jordan Sport 2 were both refreshed."
          )

          PY
