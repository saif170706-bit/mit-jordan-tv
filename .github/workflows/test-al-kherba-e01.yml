name: Test Al Kherba S1E01 ingest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest-e01:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SOURCE_URL: "https://www.youtube.com/watch?v=WKuIkuNKd1s"
      RELEASE_TAG: "al-kherba-s1-media"
      BASENAME: "AlKherbaS1E01"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"

      - name: Install yt-dlp with EJS support
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U "yt-dlp[default]"

      - name: Ensure FFmpeg is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          echo "yt-dlp: $(yt-dlp --version)"
          echo "Deno:"
          deno --version
          echo "FFmpeg:"
          ffmpeg -version | head -n 1

      - name: Show available source formats
        shell: bash
        run: |
          set -euo pipefail
          yt-dlp \
            --no-playlist \
            --js-runtimes deno \
            -F \
            "$SOURCE_URL"

      - name: Download highest accessible resolution
        shell: bash
        run: |
          set -euo pipefail

          # Selection policy:
          #   1) Highest available/downloadable resolution first.
          #   2) At that same resolution, prefer H.264/AVC.
          #   3) Prefer AAC/MP4A audio, then highest audio bitrate.
          #   4) No resolution is hard-coded.
          yt-dlp \
            --no-playlist \
            --js-runtimes deno \
            --check-formats \
            --format-sort-force \
            -S "res,+vcodec:avc,+acodec:m4a,abr" \
            -f "bv+ba/b" \
            --merge-output-format mp4 \
            --write-info-json \
            -o "source.%(ext)s" \
            "$SOURCE_URL"

          MEDIA_FILE="$(find . -maxdepth 1 -type f \
            -name 'source.*' \
            ! -name 'source.info.json' \
            ! -name '*.part' \
            ! -name '*.ytdl' \
            | head -n 1)"

          if [ -z "${MEDIA_FILE:-}" ]; then
            echo "ERROR: downloaded media file was not found"
            exit 1
          fi

          echo "MEDIA_FILE=$MEDIA_FILE" >> "$GITHUB_ENV"
          echo "Downloaded: $MEDIA_FILE"

      - name: Verify selected source quality
        shell: bash
        run: |
          set -euo pipefail

          echo "Selected source streams:"
          ffprobe -v error \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate \
            -of json \
            "$MEDIA_FILE"

          echo
          echo "yt-dlp selected format IDs:"
          python - <<'PY'
          import json

          with open("source.info.json", "r", encoding="utf-8") as f:
              info = json.load(f)

          req = info.get("requested_formats") or []
          if req:
              for x in req:
                  print(
                      f"  {x.get('format_id')} | "
                      f"{x.get('width')}x{x.get('height')} | "
                      f"vcodec={x.get('vcodec')} | "
                      f"acodec={x.get('acodec')} | "
                      f"abr={x.get('abr')}"
                  )
          else:
              print(
                  f"  {info.get('format_id')} | "
                  f"{info.get('width')}x{info.get('height')} | "
                  f"vcodec={info.get('vcodec')} | "
                  f"acodec={info.get('acodec')}"
              )
          PY

      - name: Package as single-file HLS
        shell: bash
        run: |
          set -euo pipefail

          VIDEO_CODEC="$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name -of default=nw=1:nk=1 "$MEDIA_FILE")"

          AUDIO_CODEC="$(ffprobe -v error -select_streams a:0 \
            -show_entries stream=codec_name -of default=nw=1:nk=1 "$MEDIA_FILE" || true)"

          echo "Input video codec: $VIDEO_CODEC"
          echo "Input audio codec: ${AUDIO_CODEC:-none}"

          VIDEO_ARGS=(-c:v copy)
          AUDIO_ARGS=(-c:a copy)

          # Preserve selected resolution. Only transcode codec when required
          # for broad HLS/TV compatibility.
          if [ "$VIDEO_CODEC" != "h264" ]; then
            VIDEO_ARGS=(-c:v libx264 -preset medium -crf 18)
          fi

          if [ -n "${AUDIO_CODEC:-}" ] && [ "$AUDIO_CODEC" != "aac" ]; then
            AUDIO_ARGS=(-c:a aac -b:a 160k)
          fi

          ffmpeg -y \
            -i "$MEDIA_FILE" \
            -map 0:v:0 \
            -map 0:a:0? \
            "${VIDEO_ARGS[@]}" \
            "${AUDIO_ARGS[@]}" \
            -f hls \
            -hls_time 10 \
            -hls_list_size 0 \
            -hls_playlist_type vod \
            -hls_flags single_file+independent_segments \
            -hls_segment_filename "${BASENAME}.ts" \
            "${BASENAME}.m3u8"

          test -s "${BASENAME}.ts"
          test -s "${BASENAME}.m3u8"

          echo
          echo "Generated HLS:"
          ls -lh "${BASENAME}.ts" "${BASENAME}.m3u8"
          echo
          head -n 30 "${BASENAME}.m3u8"

      - name: Build Episode 1 metadata JSON
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import subprocess

          basename = os.environ["BASENAME"]
          media = os.environ["MEDIA_FILE"]
          source_url = os.environ["SOURCE_URL"]

          with open("source.info.json", "r", encoding="utf-8") as f:
              info = json.load(f)

          def probe(selector):
              cmd = [
                  "ffprobe", "-v", "error",
                  "-select_streams", selector,
                  "-show_entries", "stream=codec_name,width,height,avg_frame_rate",
                  "-of", "json",
                  media,
              ]
              data = json.loads(subprocess.check_output(cmd, text=True))
              streams = data.get("streams", [])
              return streams[0] if streams else {}

          def duration():
              cmd = [
                  "ffprobe", "-v", "error",
                  "-show_entries", "format=duration",
                  "-of", "default=nw=1:nk=1",
                  media,
              ]
              value = subprocess.check_output(cmd, text=True).strip()
              return float(value) if value else None

          video = probe("v:0")
          audio = probe("a:0")

          requested = info.get("requested_formats") or []
          selected_ids = [x.get("format_id") for x in requested if x.get("format_id")]
          if not selected_ids and info.get("format_id"):
              selected_ids = [info["format_id"]]

          selected_video = next(
              (x for x in requested if x.get("vcodec") not in (None, "none")),
              {}
          )
          selected_audio = next(
              (x for x in requested if x.get("acodec") not in (None, "none")
               and x.get("vcodec") in (None, "none")),
              {}
          )

          metadata = {
              "series": "Al Kherba",
              "season": 1,
              "episode": 1,
              "basename": basename,
              "source_url": source_url,
              "source_id": info.get("id"),
              "title": info.get("title"),
              "duration_seconds": duration(),
              "selection_policy": (
                  "highest accessible resolution; at the same resolution prefer "
                  "H.264/AVC video and AAC/MP4A audio; no resolution is hard-coded"
              ),
              "selected_format_ids": selected_ids,
              "selected_video_format_id": selected_video.get("format_id"),
              "selected_audio_format_id": selected_audio.get("format_id"),
              "selected_source_height": selected_video.get("height") or video.get("height"),
              "selected_source_width": selected_video.get("width") or video.get("width"),
              "selected_source_vcodec": selected_video.get("vcodec"),
              "selected_source_acodec": selected_audio.get("acodec"),
              "packaged_width": video.get("width"),
              "packaged_height": video.get("height"),
              "packaged_video_codec": video.get("codec_name"),
              "packaged_audio_codec": audio.get("codec_name"),
              "ts_asset": f"{basename}.ts",
              "playlist_asset": f"{basename}.m3u8",
              "packaging": "HLS VOD using one MPEG-TS file with byte-range segments",
          }

          with open(f"{basename}.json", "w", encoding="utf-8") as f:
              json.dump(metadata, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(json.dumps(metadata, ensure_ascii=False, indent=2))
          PY

      - name: Create release if needed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Al Kherba Season 1 Media" \
              --notes "Media assets for Al Kherba Season 1."
          fi

      - name: Upload only Episode 1 assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release upload "$RELEASE_TAG" \
            "${BASENAME}.ts" \
            "${BASENAME}.m3u8" \
            "${BASENAME}.json" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

          echo
          echo "Uploaded only:"
          echo "  ${BASENAME}.ts"
          echo "  ${BASENAME}.m3u8"
          echo "  ${BASENAME}.json"
