name: Test Elahmad Stream

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-elahmad:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chrome and ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: true

      - name: Show browser versions
        run: |
          echo "Chrome:"
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version

          echo "ChromeDriver:"
          "${{ steps.setup-chrome.outputs.chromedriver-path }}" --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Test Elahmad Roya TV
        env:
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          python test_elahmad.py

      - name: Show debug output
        if: always()
        run: |
          echo "======================================"
          echo "ELAHMAD DEBUG OUTPUT"
          echo "======================================"

          if [ -f elahmad_debug.txt ]; then
            cat elahmad_debug.txt
          else
            echo "elahmad_debug.txt was not created."
          fi

      - name: Upload Elahmad diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elahmad-debug
          path: |
            elahmad_debug.txt
            elahmad_page.html
          if-no-files-found: warn
          retention-days: 7
