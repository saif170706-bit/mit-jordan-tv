name: Build Day3a Season 1 Live Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RELEASE_TAG: day3a-s1-media
      GH_TOKEN: ${{ github.token }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. DOWNLOAD ALL EPISODE METADATA
      # ============================================================

      - name: Download Season 1 episode metadata
        run: |
          set -e

          rm -rf season1-metadata
          mkdir -p season1-metadata

          echo ""
          echo "======================================"
          echo "DOWNLOADING EPISODE METADATA"
          echo "======================================"

          gh release download \
            "$RELEASE_TAG" \
            --pattern 'S1E*.json' \
            --dir season1-metadata \
            --clobber

          echo ""
          echo "Files downloaded:"
          ls -1 season1-metadata


      # ============================================================
      # 3. BUILD ONE COMPLETE LIVE-DATA FILE
      # ============================================================

      - name: Build Season 1 live metadata
        run: |
          set -e

          python - <<'PY'

          import json
          import math
          import os
          import re
          import sys

          from pathlib import Path


          RELEASE_TAG = os.environ[
              "RELEASE_TAG"
          ]

          REPOSITORY = os.environ[
              "GITHUB_REPOSITORY"
          ]


          metadata_dir = Path(
              "season1-metadata"
          )


          # ========================================================
          # FIND EPISODE JSON FILES
          # ========================================================

          files = list(
              metadata_dir.glob(
                  "S1E*.json"
              )
          )


          def episode_number(path):

              match = re.search(
                  r"S1E(\d+)",
                  path.name
              )

              if not match:
                  return 9999

              return int(
                  match.group(1)
              )


          files.sort(
              key=episode_number
          )


          print("")
          print("======================================")
          print("CHECKING SEASON")
          print("======================================")
          print(
              "Metadata files:",
              len(files)
          )


          if len(files) != 27:

              print("")
              print(
                  "ERROR: Expected 27 episode "
                  "metadata files."
              )

              print(
                  "Found:",
                  len(files)
              )

              sys.exit(1)


          # ========================================================
          # VERIFY EPISODE NUMBERS
          # ========================================================

          actual_numbers = [
              episode_number(file)
              for file in files
          ]

          expected_numbers = list(
              range(
                  1,
                  28
              )
          )


          if actual_numbers != expected_numbers:

              print("")
              print(
                  "ERROR: Episode numbers "
                  "are incomplete."
              )

              print(
                  "Found:",
                  actual_numbers
              )

              sys.exit(1)


          # ========================================================
          # GITHUB RELEASE DOWNLOAD BASE
          # ========================================================

          release_base = (
              f"https://github.com/"
              f"{REPOSITORY}/"
              f"releases/download/"
              f"{RELEASE_TAG}"
          )


          # ========================================================
          # COMBINE ALL EPISODES
          # ========================================================

          episodes = []
          all_segments = []

          total_duration = 0.0
          global_segment = 0
          maximum_segment_duration = 0.0


          for file in files:

              with open(
                  file,
                  "r",
                  encoding="utf-8"
              ) as f:

                  data = json.load(f)


              episode = int(
                  data["episode"]
              )

              name = data[
                  "name"
              ]

              ts_asset = data[
                  "ts_asset"
              ]

              width = int(
                  data["width"]
              )

              height = int(
                  data["height"]
              )

              segments = data[
                  "segments"
              ]


              if not segments:

                  print(
                      "ERROR:",
                      name,
                      "contains no segments"
                  )

                  sys.exit(1)


              episode_start_segment = (
                  global_segment
              )

              episode_start_time = (
                  total_duration
              )

              episode_duration = 0.0


              ts_url = (
                  f"{release_base}/"
                  f"{ts_asset}"
              )


              print("")
              print(
                  f"{name}: "
                  f"{width}x{height}"
              )

              print(
                  "Segments:",
                  len(segments)
              )


              for segment_index, segment in enumerate(
                  segments
              ):

                  duration = float(
                      segment[
                          "duration"
                      ]
                  )

                  length = int(
                      segment[
                          "length"
                      ]
                  )

                  offset = int(
                      segment[
                          "offset"
                      ]
                  )


                  maximum_segment_duration = max(
                      maximum_segment_duration,
                      duration
                  )


                  entry = {
                      "global_index":
                          global_segment,

                      "episode":
                          episode,

                      "episode_name":
                          name,

                      "episode_segment":
                          segment_index,

                      "duration":
                          duration,

                      "length":
                          length,

                      "offset":
                          offset,

                      "media_url":
                          ts_url,

                      "discontinuity":
                          (
                              segment_index == 0
                              and
                              global_segment > 0
                          ),
                  }


                  all_segments.append(
                      entry
                  )


                  global_segment += 1

                  episode_duration += (
                      duration
                  )

                  total_duration += (
                      duration
                  )


              episodes.append({
                  "season":
                      1,

                  "episode":
                      episode,

                  "name":
                      name,

                  "width":
                      width,

                  "height":
                      height,

                  "duration":
                      episode_duration,

                  "segment_count":
                      len(segments),

                  "start_segment":
                      episode_start_segment,

                  "start_time":
                      episode_start_time,

                  "ts_asset":
                      ts_asset,

                  "media_url":
                      ts_url,
              })


          # ========================================================
          # FINAL LIVE METADATA
          # ========================================================

          live_data = {
              "channel":
                  "Day3a Day3a S1",

              "season":
                  1,

              "episode_count":
                  len(episodes),

              "total_duration":
                  total_duration,

              "total_segments":
                  len(all_segments),

              "target_duration":
                  math.ceil(
                      maximum_segment_duration
                  ),

              "release_tag":
                  RELEASE_TAG,

              "release_base":
                  release_base,

              "episodes":
                  episodes,

              "segments":
                  all_segments,
          }


          # ========================================================
          # VERIFY
          # ========================================================

          if live_data[
              "episode_count"
          ] != 27:

              raise SystemExit(
                  "ERROR: episode count is not 27"
              )


          if live_data[
              "total_segments"
          ] <= 0:

              raise SystemExit(
                  "ERROR: no segments found"
              )


          if live_data[
              "total_duration"
          ] <= 0:

              raise SystemExit(
                  "ERROR: invalid total duration"
              )


          # ========================================================
          # WRITE FILE
          # ========================================================

          output = Path(
              "season1-live.json"
          )


          output.write_text(
              json.dumps(
                  live_data,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )


          # ========================================================
          # SUMMARY
          # ========================================================

          hours = (
              total_duration
              /
              3600
          )


          print("")
          print("======================================")
          print("SEASON 1 LIVE DATA COMPLETE")
          print("======================================")

          print(
              "Episodes:",
              len(episodes)
          )

          print(
              "Segments:",
              len(all_segments)
          )

          print(
              "Total seconds:",
              total_duration
          )

          print(
              "Total hours:",
              round(
                  hours,
                  2
              )
          )

          print(
              "Target duration:",
              live_data[
                  "target_duration"
              ]
          )

          print("")
          print(
              "SUCCESS: "
              "season1-live.json created"
          )

          PY


      # ============================================================
      # 4. UPLOAD LIVE DATA TO THE EXISTING RELEASE
      # ============================================================

      - name: Upload Season 1 live data
        run: |
          set -e

          echo ""
          echo "======================================"
          echo "UPLOADING LIVE DATA"
          echo "======================================"

          gh release upload \
            "$RELEASE_TAG" \
            season1-live.json \
            --clobber

          echo ""
          echo "SUCCESS:"
          echo "season1-live.json uploaded"


      # ============================================================
      # 5. VERIFY RELEASE ASSET
      # ============================================================

      - name: Verify live-data asset
        run: |
          set -e

          echo ""
          echo "======================================"
          echo "VERIFY RELEASE"
          echo "======================================"

          gh release view \
            "$RELEASE_TAG" \
            --json assets \
            --jq '.assets[].name' \
            | grep '^season1-live.json$'

          echo ""
          echo "SUCCESS:"
          echo "Season 1 live metadata is ready."


      # ============================================================
      # 6. KEEP A SMALL DEBUG COPY
      # ============================================================

      - name: Upload live-data artifact
        uses: actions/upload-artifact@v4
        with:
          name: day3a-season1-live-data
          path: season1-live.json
          retention-days: 7
          if-no-files-found: error
