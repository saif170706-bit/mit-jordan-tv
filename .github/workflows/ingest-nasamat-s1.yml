  # ============================================================
  # BUILD INDEX AFTER ALL MATRIX JOBS HAVE BEEN ATTEMPTED
  # ============================================================

  build_index:
    if: >-
      ${{
        always()
        &&
        needs.prepare.result == 'success'
        &&
        (
          needs.ingest.result == 'success'
          ||
          needs.ingest.result == 'skipped'
        )
      }}

    needs:
      - prepare
      - ingest

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Download episode metadata
        run: |
          set -e

          rm -rf nasamat-metadata
          mkdir -p nasamat-metadata

          gh release download \
            "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'NasamatS1E*.json' \
            --dir nasamat-metadata \
            --clobber


      - name: Build Season 1 index
        run: |
          set -e

          python - <<'PY'

          import json
          import os
          import re

          from pathlib import Path


          RELEASE_TAG = os.environ[
              "RELEASE_TAG"
          ]

          REPOSITORY = os.environ[
              "GITHUB_REPOSITORY"
          ]


          metadata_dir = Path(
              "nasamat-metadata"
          )


          files = list(
              metadata_dir.glob(
                  "NasamatS1E*.json"
              )
          )


          def episode_number(
              path
          ):

              match = re.search(
                  r"NasamatS1E(\d+)",
                  path.name
              )


              return (
                  int(
                      match.group(1)
                  )
                  if match
                  else
                  9999
              )


          files.sort(
              key=episode_number
          )


          release_base = (
              f"https://github.com/"
              f"{REPOSITORY}/"
              f"releases/download/"
              f"{RELEASE_TAG}"
          )


          episodes = []

          total_duration = 0.0


          for path in files:

              with open(
                  path,
                  "r",
                  encoding="utf-8"
              ) as f:

                  data = json.load(f)


              duration = float(
                  data[
                      "packaged_duration"
                  ]
              )


              total_duration += (
                  duration
              )


              episodes.append({
                  "season":
                      1,

                  "episode":
                      data[
                          "episode"
                      ],

                  "name":
                      data[
                          "name"
                      ],

                  "width":
                      data[
                          "width"
                      ],

                  "height":
                      data[
                          "height"
                      ],

                  "duration":
                      duration,

                  "segment_count":
                      data[
                          "segment_count"
                      ],

                  "ts_asset":
                      data[
                          "ts_asset"
                      ],

                  "ts_url":
                      (
                          f"{release_base}/"
                          f"{data['ts_asset']}"
                      ),

                  "playlist_asset":
                      data[
                          "playlist_asset"
                      ],

                  "metadata_asset":
                      data[
                          "metadata_asset"
                      ],
              })


          episodes.sort(
              key=lambda item:
                  item[
                      "episode"
                  ]
          )


          index = {
              "series":
                  "Nasamat Aylul",

              "season":
                  1,

              "episode_count":
                  len(
                      episodes
                  ),

              "expected_episode_count":
                  30,

              "total_duration":
                  total_duration,

              "release_tag":
                  RELEASE_TAG,

              "release_base":
                  release_base,

              "episodes":
                  episodes,
          }


          output = Path(
              "nasamat-season1-index.json"
          )


          output.write_text(
              json.dumps(
                  index,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )


          print("")
          print(
              "======================================"
          )

          print(
              "NASAMAT SEASON 1 INDEX"
          )

          print(
              "======================================"
          )

          print(
              "Episodes present:",
              len(
                  episodes
              )
          )

          print(
              "Expected:",
              30
          )


          print("")
          print(
              "QUALITY:"
          )


          for episode in episodes:

              print(
                  f"E"
                  f"{episode['episode']:02d}: "
                  f"{episode['width']}x"
                  f"{episode['height']}"
              )


          if (
              len(
                  episodes
              )
              ==
              30
          ):

              print("")
              print(
                  "SUCCESS: "
                  "ALL 30 EPISODES PRESENT"
              )

          else:

              print("")
              print(
                  "ERROR: "
                  f"{30 - len(episodes)} "
                  f"episodes are still missing."
              )

              raise SystemExit(1)

          PY


      - name: Upload Season 1 index
        run: |
          set -e

          gh release upload \
            "$RELEASE_TAG" \
            nasamat-season1-index.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
