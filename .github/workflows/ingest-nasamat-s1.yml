name: Ingest Nasamat Aylul Season 1

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild episodes already uploaded"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nasamat-season-1-ingest
  cancel-in-progress: false

env:
  RELEASE_TAG: nasamat-s1-media
  SOURCE_FILE: nasamat_s1_sources.csv
  GH_TOKEN: ${{ github.token }}

jobs:

  # ============================================================
  # PREPARE
  # ============================================================

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      episodes: ${{ steps.missing.outputs.episodes }}
      has_missing: ${{ steps.missing.outputs.has_missing }}
      missing_count: ${{ steps.missing.outputs.missing_count }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Validate source CSV
        run: |
          set -e

          python - <<'PY'

          import csv
          import os
          import sys


          filename = os.environ["SOURCE_FILE"]


          if not os.path.exists(filename):
              print("")
              print("ERROR:")
              print(f"{filename} was not found.")
              print("")
              sys.exit(1)


          with open(
              filename,
              "r",
              encoding="utf-8-sig",
              newline=""
          ) as f:

              reader = csv.DictReader(f)
              rows = list(reader)


          required = {
              "season",
              "episode",
              "m3u8_url",
          }


          fields = set(
              reader.fieldnames or []
          )


          missing = (
              required - fields
          )


          if missing:

              print(
                  "ERROR: Missing CSV columns:",
                  ", ".join(
                      sorted(missing)
                  )
              )

              sys.exit(1)


          if len(rows) != 30:

              print(
                  "ERROR: Expected 30 episodes."
              )

              print(
                  "Found:",
                  len(rows)
              )

              sys.exit(1)


          seen = set()


          for row in rows:

              season = (
                  row["season"]
                  .strip()
              )

              episode_text = (
                  row["episode"]
                  .strip()
              )

              url = (
                  row["m3u8_url"]
                  .strip()
              )


              if season != "1":

                  raise SystemExit(
                      f"Wrong season for "
                      f"episode {episode_text}"
                  )


              episode = int(
                  episode_text
              )


              if episode in seen:

                  raise SystemExit(
                      f"Duplicate episode: "
                      f"{episode}"
                  )


              seen.add(
                  episode
              )


              if not url.startswith(
                  "https://"
              ):

                  raise SystemExit(
                      f"S1E{episode:02d} "
                      f"does not use HTTPS"
                  )


              if ".m3u8" not in url:

                  raise SystemExit(
                      f"S1E{episode:02d} "
                      f"is not an M3U8 URL"
                  )


          expected = set(
              range(
                  1,
                  31
              )
          )


          if seen != expected:

              raise SystemExit(
                  "Episode numbers must "
                  "be exactly 1-30."
              )


          print("")
          print(
              "======================================"
          )

          print(
              "NASAMAT AYlUL SOURCE LIST OK"
          )

          print(
              "======================================"
          )

          print(
              "Episodes:",
              len(rows)
          )

          print("")

          PY


      - name: Create media release if needed
        run: |
          set -e

          if gh release view \
            "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1
          then

            echo ""
            echo "Release already exists:"
            echo "$RELEASE_TAG"

          else

            echo ""
            echo "Creating release:"
            echo "$RELEASE_TAG"

            gh release create \
              "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nasamat Aylul - Season 1 Media" \
              --notes "Permanent packaged media assets for Nasamat Aylul Season 1." \
              --latest=false

          fi


      - name: Determine episodes to ingest
        id: missing
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -e

          rm -f release-assets.txt

          gh release view \
            "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' \
            > release-assets.txt

          python - <<'PY'

          import json
          import os
          from pathlib import Path


          assets = {
              line.strip()
              for line
              in Path(
                  "release-assets.txt"
              )
              .read_text(
                  encoding="utf-8"
              )
              .splitlines()
              if line.strip()
          }


          force = (
              os.environ.get(
                  "FORCE_REBUILD",
                  "false"
              ).lower()
              ==
              "true"
          )


          episodes = []


          print("")
          print(
              "======================================"
          )

          print(
              "NASAMAT RELEASE ASSET CHECK"
          )

          print(
              "======================================"
          )

          print(
              "Release assets found:",
              len(assets)
          )

          print(
              "Force rebuild:",
              force
          )

          print("")


          for episode in range(
              1,
              31
          ):

              base = (
                  f"NasamatS1E"
                  f"{episode:02d}"
              )

              required = {
                  f"{base}.ts",
                  f"{base}.m3u8",
                  f"{base}.json",
              }

              missing_assets = (
                  required - assets
              )


              if (
                  force
                  or
                  missing_assets
              ):

                  episodes.append(
                      episode
                  )

                  if force:

                      print(
                          f"E{episode:02d}: "
                          "REBUILD REQUESTED"
                      )

                  else:

                      print(
                          f"E{episode:02d}: "
                          "MISSING -> "
                          +
                          ", ".join(
                              sorted(
                                  missing_assets
                              )
                          )
                      )

              else:

                  print(
                      f"E{episode:02d}: "
                      "COMPLETE"
                  )


          has_missing = bool(
              episodes
          )


          print("")
          print(
              "Episodes to ingest:",
              episodes
          )

          print(
              "Count:",
              len(episodes)
          )

          print("")


          output_path = os.environ[
              "GITHUB_OUTPUT"
          ]


          with open(
              output_path,
              "a",
              encoding="utf-8"
          ) as output:

              output.write(
                  "episodes="
                  +
                  json.dumps(
                      episodes,
                      separators=(
                          ",",
                          ":"
                      )
                  )
                  +
                  "\n"
              )

              output.write(
                  "has_missing="
                  +
                  (
                      "true"
                      if has_missing
                      else
                      "false"
                  )
                  +
                  "\n"
              )

              output.write(
                  "missing_count="
                  +
                  str(
                      len(episodes)
                  )
                  +
                  "\n"
              )

          PY


  # ============================================================
  # INGEST EPISODES
  #
  # Four episodes are processed simultaneously.
  # ============================================================

  ingest:
    needs: prepare

    if: ${{ needs.prepare.outputs.has_missing == 'true' }}

    runs-on: ubuntu-latest

    timeout-minutes: 120

    strategy:
      fail-fast: false

      max-parallel: 4

      matrix:
        episode: ${{ fromJSON(needs.prepare.outputs.episodes) }}

    env:
      EPISODE: ${{ matrix.episode }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Ensure FFmpeg is available
        run: |
          set -e

          if ! command -v ffmpeg >/dev/null 2>&1
          then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          echo ""
          ffmpeg -version | head -n 1

          echo ""
          ffprobe -version | head -n 1


      - name: Ingest episode
        run: |
          cat > ingest_nasamat_episode.py <<'PY'

          import csv
          import json
          import math
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          import urllib.parse
          import urllib.request

          from pathlib import Path


          # ========================================================
          # SETTINGS
          # ========================================================

          EPISODE = int(
              os.environ["EPISODE"]
          )

          SOURCE_FILE = os.environ[
              "SOURCE_FILE"
          ]

          RELEASE_TAG = os.environ[
              "RELEASE_TAG"
          ]

          USER_AGENT = (
              "Mozilla/5.0 "
              "(Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/151.0.0.0 "
              "Safari/537.36"
          )


          HTTP_HEADERS = {
              "User-Agent":
                  USER_AGENT,

              "Origin":
                  "https://en.roya.tv",

              "Referer":
                  "https://en.roya.tv/",

              "Accept":
                  "*/*",
          }


          FFMPEG_HEADERS = (
              "Origin: https://en.roya.tv\r\n"
              "Referer: https://en.roya.tv/\r\n"
              f"User-Agent: {USER_AGENT}\r\n"
          )


          # ========================================================
          # COMMAND HELPER
          # ========================================================

          def run_command(
              command,
              *,
              timeout=None,
              capture=True,
              check=True
          ):

              print("")
              print(
                  "$",
                  " ".join(
                      str(item)
                      for item
                      in command
                  )
              )


              process = subprocess.run(
                  command,
                  text=True,
                  capture_output=capture,
                  timeout=timeout,
              )


              if capture:

                  if process.stdout:
                      print(
                          process.stdout
                      )

                  if process.stderr:
                      print(
                          process.stderr
                      )


              if (
                  check
                  and
                  process.returncode != 0
              ):

                  raise RuntimeError(
                      "Command failed with "
                      f"exit code "
                      f"{process.returncode}"
                  )


              return process


          # ========================================================
          # FIND SOURCE URL
          # ========================================================

          with open(
              SOURCE_FILE,
              "r",
              encoding="utf-8-sig",
              newline=""
          ) as f:

              rows = list(
                  csv.DictReader(f)
              )


          row = next(
              (
                  row
                  for row
                  in rows
                  if int(
                      row["episode"]
                  )
                  ==
                  EPISODE
              ),
              None
          )


          if row is None:

              raise SystemExit(
                  f"Episode {EPISODE} "
                  f"was not found in CSV."
              )


          master_url = (
              row["m3u8_url"]
              .strip()
          )


          name = (
              f"NasamatS1E"
              f"{EPISODE:02d}"
          )


          ts_name = (
              f"{name}.ts"
          )

          playlist_name = (
              f"{name}.m3u8"
          )

          json_name = (
              f"{name}.json"
          )


          print("")
          print(
              "======================================"
          )

          print(
              f"NASAMAT AYlUL {name}"
          )

          print(
              "======================================"
          )


          # ========================================================
          # FETCH MASTER PLAYLIST
          # ========================================================

          def fetch_master(
              url
          ):

              request = (
                  urllib.request.Request(
                      url,
                      headers=HTTP_HEADERS
                  )
              )


              with urllib.request.urlopen(
                  request,
                  timeout=45
              ) as response:

                  if response.status != 200:

                      raise RuntimeError(
                          "Master playlist returned "
                          f"HTTP {response.status}"
                      )


                  body = (
                      response.read()
                      .decode(
                          "utf-8",
                          errors="replace"
                      )
                  )


              if "#EXTM3U" not in body:

                  raise RuntimeError(
                      "Response is not an "
                      "HLS playlist."
                  )


              return body


          print("")
          print(
              "Fetching master playlist..."
          )


          master_text = fetch_master(
              master_url
          )


          # ========================================================
          # PARSE MASTER VARIANTS
          # ========================================================

          def parse_variants(
              master_text,
              master_url
          ):

              lines = [
                  line.strip()
                  for line
                  in master_text
                      .splitlines()
              ]


              variants = []


              for index, line in enumerate(
                  lines
              ):

                  if not line.startswith(
                      "#EXT-X-STREAM-INF:"
                  ):

                      continue


                  resolution_match = (
                      re.search(
                          r"RESOLUTION="
                          r"(\d+)x(\d+)",
                          line
                      )
                  )


                  bandwidth_match = (
                      re.search(
                          r"BANDWIDTH="
                          r"(\d+)",
                          line
                      )
                  )


                  width = (
                      int(
                          resolution_match
                              .group(1)
                      )
                      if resolution_match
                      else 0
                  )


                  height = (
                      int(
                          resolution_match
                              .group(2)
                      )
                      if resolution_match
                      else 0
                  )


                  bandwidth = (
                      int(
                          bandwidth_match
                              .group(1)
                      )
                      if bandwidth_match
                      else 0
                  )


                  uri = None


                  for next_index in range(
                      index + 1,
                      len(lines)
                  ):

                      candidate = (
                          lines[next_index]
                      )


                      if not candidate:

                          continue


                      if candidate.startswith(
                          "#"
                      ):

                          break


                      uri = candidate
                      break


                  if not uri:

                      continue


                  absolute_url = (
                      urllib.parse.urljoin(
                          master_url,
                          uri
                      )
                  )


                  variants.append({
                      "width":
                          width,

                      "height":
                          height,

                      "bandwidth":
                          bandwidth,

                      "url":
                          absolute_url,
                  })


              variants.sort(
                  key=lambda item: (
                      item["height"],
                      item["width"],
                      item["bandwidth"],
                  ),
                  reverse=True
              )


              return variants


          variants = parse_variants(
              master_text,
              master_url
          )


          print("")
          print(
              "MASTER VARIANTS:"
          )


          if variants:

              for variant in variants:

                  print(
                      f" - "
                      f"{variant['width']}x"
                      f"{variant['height']} "
                      f"bandwidth="
                      f"{variant['bandwidth']}"
                  )

          else:

              print(
                  "No multivariant entries found."
              )


          # ========================================================
          # FFPROBE A VARIANT
          # ========================================================

          def probe_variant(
              url
          ):

              process = run_command(
                  [
                      "ffprobe",

                      "-v",
                      "error",

                      "-headers",
                      FFMPEG_HEADERS,

                      "-rw_timeout",
                      "20000000",

                      "-show_entries",
                      (
                          "stream="
                          "codec_type,"
                          "codec_name,"
                          "width,"
                          "height,"
                          "r_frame_rate"
                      ),

                      "-show_entries",
                      (
                          "format="
                          "duration,"
                          "bit_rate"
                      ),

                      "-of",
                      "json",

                      url,
                  ],
                  timeout=60,
              )


              data = json.loads(
                  process.stdout
              )


              videos = [
                  stream
                  for stream
                  in data.get(
                      "streams",
                      []
                  )
                  if (
                      stream.get(
                          "codec_type"
                      )
                      ==
                      "video"
                  )
              ]


              if not videos:

                  raise RuntimeError(
                      "No video stream found"
                  )


              video = max(
                  videos,
                  key=lambda stream:
                      int(
                          stream.get(
                              "height"
                          )
                          or 0
                      )
              )


              width = int(
                  video.get(
                      "width"
                  )
                  or 0
              )


              height = int(
                  video.get(
                      "height"
                  )
                  or 0
              )


              duration_text = (
                  data.get(
                      "format",
                      {}
                  )
                  .get(
                      "duration"
                  )
              )


              duration = (
                  float(
                      duration_text
                  )
                  if duration_text
                  else 0.0
              )


              return {
                  "width":
                      width,

                  "height":
                      height,

                  "fps":
                      video.get(
                          "r_frame_rate"
                      )
                      or "",

                  "video_codec":
                      video.get(
                          "codec_name"
                      )
                      or "",

                  "duration":
                      duration,
              }


          # ========================================================
          # CHOOSE HIGHEST ACCESSIBLE QUALITY
          # ========================================================

          selected_url = None

          selected_info = None


          candidates = list(
              variants
          )


          if not candidates:

              # The URL may itself be a media playlist,
              # so try it once directly.

              candidates = [{
                  "width": 0,
                  "height": 0,
                  "bandwidth": 0,
                  "url": master_url,
              }]


          print("")
          print(
              "TESTING HIGHEST "
              "ACCESSIBLE QUALITY..."
          )


          for candidate in candidates:

              print("")
              print(
                  "Trying:",
                  (
                      f"{candidate['width']}x"
                      f"{candidate['height']}"
                      if candidate["height"]
                      else
                      "direct playlist"
                  )
              )


              try:

                  info = probe_variant(
                      candidate["url"]
                  )


                  print(
                      "ffprobe actual:",
                      f"{info['width']}x"
                      f"{info['height']}"
                  )


                  selected_url = (
                      candidate["url"]
                  )

                  selected_info = (
                      info
                  )

                  break


              except Exception as exc:

                  print(
                      "Variant failed:",
                      str(exc)
                  )


          if (
              selected_url is None
              or
              selected_info is None
          ):

              raise RuntimeError(
                  "No accessible stream "
                  "variant was found."
              )


          print("")
          print(
              "======================================"
          )

          print(
              "QUALITY SELECTED"
          )

          print(
              "======================================"
          )

          print(
              "Resolution:",
              f"{selected_info['width']}x"
              f"{selected_info['height']}"
          )

          print(
              "FPS:",
              selected_info["fps"]
          )

          print(
              "Duration:",
              selected_info["duration"]
          )


          if (
              selected_info["height"]
              >= 1080
          ):

              print(
                  "QUALITY: 1080p"
              )

          elif (
              selected_info["height"]
              >= 720
          ):

              print(
                  "QUALITY: 720p"
              )

          else:

              print(
                  "QUALITY:",
                  f"{selected_info['height']}p"
              )


          # ========================================================
          # TEMPORARY WORK DIRECTORY
          # ========================================================

          workdir = Path(
              tempfile.mkdtemp(
                  prefix=(
                      f"{name}-"
                  )
              )
          )


          try:

              ts_path = (
                  workdir
                  /
                  ts_name
              )


              playlist_path = (
                  workdir
                  /
                  playlist_name
              )


              json_path = (
                  workdir
                  /
                  json_name
              )


              # ====================================================
              # PACKAGE AS SINGLE-FILE HLS
              # ====================================================

              print("")
              print(
                  "Packaging episode..."
              )


              run_command(
                  [
                      "ffmpeg",

                      "-y",

                      "-headers",
                      FFMPEG_HEADERS,

                      "-rw_timeout",
                      "30000000",

                      "-reconnect",
                      "1",

                      "-reconnect_streamed",
                      "1",

                      "-reconnect_delay_max",
                      "5",

                      "-i",
                      selected_url,

                      "-map",
                      "0:v:0",

                      "-map",
                      "0:a:0?",

                      "-c",
                      "copy",

                      "-f",
                      "hls",

                      "-hls_time",
                      "6",

                      "-hls_list_size",
                      "0",

                      "-hls_playlist_type",
                      "vod",

                      "-hls_flags",
                      "single_file",

                      "-hls_segment_filename",
                      str(
                          ts_path
                      ),

                      str(
                          playlist_path
                      ),
                  ],
                  timeout=5400,
                  capture=False,
              )


              # ====================================================
              # CHECK OUTPUT
              # ====================================================

              if not ts_path.exists():

                  raise RuntimeError(
                      "TS file was not created."
                  )


              if not playlist_path.exists():

                  raise RuntimeError(
                      "M3U8 file was not created."
                  )


              ts_size = (
                  ts_path
                  .stat()
                  .st_size
              )


              if ts_size <= 0:

                  raise RuntimeError(
                      "TS file is empty."
                  )


              if ts_size >= (
                  2 * 1024 ** 3
              ):

                  raise RuntimeError(
                      "TS file is 2 GiB "
                      "or larger."
                  )


              # ====================================================
              # PARSE BYTE RANGES
              # ====================================================

              def parse_single_file_hls(
                  path
              ):

                  lines = [
                      line.strip()
                      for line
                      in Path(path)
                          .read_text(
                              encoding="utf-8"
                          )
                          .splitlines()
                  ]


                  if (
                      "#EXT-X-ENDLIST"
                      not in lines
                  ):

                      raise RuntimeError(
                          "Generated playlist "
                          "has no ENDLIST."
                      )


                  segments = []

                  pending_duration = None

                  pending_range = None

                  previous_end = 0


                  for line in lines:

                      if line.startswith(
                          "#EXTINF:"
                      ):

                          value = (
                              line.split(
                                  ":",
                                  1
                              )[1]
                              .split(
                                  ",",
                                  1
                              )[0]
                          )


                          pending_duration = (
                              float(
                                  value
                              )
                          )


                      elif line.startswith(
                          "#EXT-X-BYTERANGE:"
                      ):

                          value = (
                              line.split(
                                  ":",
                                  1
                              )[1]
                          )


                          if "@" in value:

                              (
                                  length_text,
                                  offset_text
                              ) = value.split(
                                  "@",
                                  1
                              )


                              length = int(
                                  length_text
                              )


                              offset = int(
                                  offset_text
                              )


                          else:

                              length = int(
                                  value
                              )


                              offset = (
                                  previous_end
                              )


                          pending_range = {
                              "length":
                                  length,

                              "offset":
                                  offset,
                          }


                      elif (
                          line
                          and
                          not line.startswith(
                              "#"
                          )
                      ):

                          if (
                              pending_duration
                              is not None
                              and
                              pending_range
                              is not None
                          ):

                              segment = {
                                  "duration":
                                      pending_duration,

                                  "length":
                                      pending_range[
                                          "length"
                                      ],

                                  "offset":
                                      pending_range[
                                          "offset"
                                      ],
                              }


                              segments.append(
                                  segment
                              )


                              previous_end = (
                                  segment["offset"]
                                  +
                                  segment["length"]
                              )


                              pending_duration = None

                              pending_range = None


                  if not segments:

                      raise RuntimeError(
                          "No byte-range "
                          "segments parsed."
                      )


                  return segments


              segments = (
                  parse_single_file_hls(
                      playlist_path
                  )
              )


              packaged_duration = sum(
                  segment["duration"]
                  for segment
                  in segments
              )


              # ====================================================
              # EPISODE METADATA
              # ====================================================

              metadata = {
                  "series":
                      "Nasamat Aylul",

                  "season":
                      1,

                  "episode":
                      EPISODE,

                  "name":
                      name,

                  "width":
                      selected_info[
                          "width"
                      ],

                  "height":
                      selected_info[
                          "height"
                      ],

                  "fps":
                      selected_info[
                          "fps"
                      ],

                  "video_codec":
                      selected_info[
                          "video_codec"
                      ],

                  "source_duration":
                      selected_info[
                          "duration"
                      ],

                  "packaged_duration":
                      packaged_duration,

                  "segment_count":
