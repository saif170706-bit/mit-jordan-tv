name: Test Day3a Force 720p

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Playwright Chromium and FFmpeg
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install playwright

          playwright install --with-deps chromium

          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Read first episode from CSV
        id: source
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import csv
          import os
          import sys

          filename = "day3a_sources.csv"

          if not os.path.exists(filename):
              print("ERROR: day3a_sources.csv not found")
              sys.exit(1)

          with open(
              filename,
              "r",
              encoding="utf-8-sig",
              newline=""
          ) as f:
              rows = list(csv.DictReader(f))

          if not rows:
              print("ERROR: CSV is empty")
              sys.exit(1)

          row = rows[0]

          season = (row.get("season") or "").strip()
          episode = (row.get("episode") or "").strip()
          url = (row.get("url") or "").strip()

          if not url:
              print("ERROR: No URL in first row")
              sys.exit(1)

          print("======================================")
          print("EPISODE")
          print("======================================")
          print("Season:", season)
          print("Episode:", episode)
          print("URL:", url)

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as out:
              out.write(f"url={url}\n")
          PY

      - name: Create 720p browser scanner
        run: |
          cat > force_720.py <<'PY'

          import os
          import json
          import time
          import subprocess

          from playwright.sync_api import sync_playwright


          VIDEO_URL = os.environ["VIDEO_URL"]

          hls_urls = []


          def add_hls(url, source):
              if not url:
                  return

              if ".m3u8" not in url.lower():
                  return

              item = {
                  "url": url,
                  "source": source,
              }

              if not any(
                  x["url"] == url
                  for x in hls_urls
              ):
                  hls_urls.append(item)

                  print("")
                  print("HLS FOUND:")
                  print("Source:", source)
                  print(url)


          def request_handler(request):
              add_hls(
                  request.url,
                  "request"
              )


          def response_handler(response):
              try:
                  content_type = (
                      response.headers.get(
                          "content-type",
                          ""
                      )
                  )
              except Exception:
                  content_type = ""

              if (
                  ".m3u8" in response.url.lower()
                  or
                  "mpegurl" in content_type.lower()
              ):
                  add_hls(
                      response.url,
                      "response"
                  )


          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--autoplay-policy=no-user-gesture-required",
                      "--disable-dev-shm-usage",
                      "--no-sandbox",
                  ],
              )

              context = browser.new_context(
                  viewport={
                      "width": 1920,
                      "height": 1080,
                  },

                  locale="da-DK",

                  user_agent=(
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/151.0.0.0 "
                      "Safari/537.36"
                  ),
              )

              context.on(
                  "request",
                  request_handler
              )

              context.on(
                  "response",
                  response_handler
              )

              page = context.new_page()

              print("")
              print("======================================")
              print("OPENING DAILYMOTION")
              print("======================================")
              print(VIDEO_URL)

              page.goto(
                  VIDEO_URL,
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              page.wait_for_timeout(
                  10000
              )


              # ====================================================
              # ACCEPT COOKIE/CONSENT UI IF PRESENT
              # ====================================================

              consent_words = [
                  "Accept all",
                  "Accept All",
                  "Accept",
                  "Accepter alle",
                  "Accepter",
                  "Tillad alle",
                  "Agree",
                  "I agree",
              ]

              for word in consent_words:

                  try:

                      button = page.get_by_text(
                          word,
                          exact=False
                      ).first

                      if button.is_visible(
                          timeout=1000
                      ):

                          print(
                              "Clicking consent:",
                              word
                          )

                          button.click(
                              timeout=3000
                          )

                          page.wait_for_timeout(
                              2000
                          )

                          break

                  except Exception:
                      pass


              # ====================================================
              # CHECK WHETHER DAILYMOTION WEB SDK IS AVAILABLE
              # ====================================================

              print("")
              print("======================================")
              print("CHECKING DAILYMOTION PLAYER SDK")
              print("======================================")

              sdk_info = page.evaluate(
                  """
                  () => {
                      return {
                          hasDailymotion:
                              typeof window.dailymotion
                              !== "undefined",

                          hasGetPlayer:
                              !!(
                                  window.dailymotion
                                  &&
                                  window.dailymotion.getPlayer
                              ),

                          hasGetAllPlayers:
                              !!(
                                  window.dailymotion
                                  &&
                                  window.dailymotion.getAllPlayers
                              )
                      };
                  }
                  """
              )

              print(
                  json.dumps(
                      sdk_info,
                      indent=2
                  )
              )


              # ====================================================
              # TRY PUBLIC DAILYMOTION PLAYER SDK
              # ====================================================

              sdk_result = page.evaluate(
                  """
                  async () => {

                      const result = {
                          method: "sdk",
                          players: [],
                          error: null
                      };


                      try {

                          if (
                              !window.dailymotion
                              ||
                              !window.dailymotion.getAllPlayers
                          ) {
                              result.error =
                                  "Dailymotion SDK/player list unavailable";

                              return result;
                          }


                          const promises =
                              window.dailymotion.getAllPlayers();

                          result.promiseCount =
                              promises.length;


                          const players =
                              await Promise.all(
                                  promises
                              );


                          for (
                              let i = 0;
                              i < players.length;
                              i++
                          ) {

                              const player =
                                  players[i];

                              const data = {
                                  index: i
                              };


                              try {

                                  const stateBefore =
                                      await player.getState();

                                  data.stateBefore =
                                      stateBefore;

                              } catch (error) {

                                  data.stateBeforeError =
                                      String(error);
                              }


                              try {

                                  await player.setQuality(
                                      "720"
                                  );

                                  data.setQuality =
                                      "720 requested";

                              } catch (error) {

                                  data.setQualityError =
                                      String(error);
                              }


                              try {

                                  await player.play();

                                  data.play =
                                      "requested";

                              } catch (error) {

                                  data.playError =
                                      String(error);
                              }


                              await new Promise(
                                  resolve =>
                                      setTimeout(
                                          resolve,
                                          5000
                                      )
                              );


                              try {

                                  const stateAfter =
                                      await player.getState();

                                  data.stateAfter =
                                      stateAfter;

                              } catch (error) {

                                  data.stateAfterError =
                                      String(error);
                              }


                              result.players.push(
                                  data
                              );
                          }


                      } catch (error) {

                          result.error =
                              String(error);
                      }


                      return result;
                  }
                  """
              )


              print("")
              print("======================================")
              print("SDK FORCE-720 RESULT")
              print("======================================")

              print(
                  json.dumps(
                      sdk_result,
                      indent=2,
                      default=str
                  )
              )


              # Give player time to request the new rendition.
              page.wait_for_timeout(
                  12000
              )


              # ====================================================
              # UI FALLBACK
              #
              # If the public SDK isn't exposed on dailymotion.com,
              # try opening player settings and clicking 720.
              # ====================================================

              print("")
              print("======================================")
              print("TRYING UI 720P FALLBACK")
              print("======================================")


              # First ensure video is playing/muted where possible.
              for frame in page.frames:

                  try:

                      frame.evaluate(
                          """
                          () => {
                              const videos =
                                  document.querySelectorAll(
                                      "video"
                                  );

                              for (
                                  const video
                                  of videos
                              ) {
                                  video.muted = true;

                                  video.play()
                                      .catch(
                                          () => {}
                                      );
                              }
                          }
                          """
                      )

                  except Exception:
                      pass


              # Search for buttons that may open settings.
              settings_terms = [
                  "Settings",
                  "Quality",
                  "Player settings",
                  "Video quality",
                  "Indstillinger",
                  "Kvalitet",
              ]


              for frame in page.frames:

                  for term in settings_terms:

                      try:

                          locator = frame.get_by_text(
                              term,
                              exact=False
                          ).first

                          if locator.is_visible(
                              timeout=800
                          ):

                              print(
                                  "Found settings text:",
                                  term
                              )

                              locator.click(
                                  timeout=3000
                              )

                              page.wait_for_timeout(
                                  1500
                              )

                      except Exception:
                          pass


              # Try 720 text after settings menu has opened.
              clicked_720 = False


              for frame in page.frames:

                  for term in [
                      "720p",
                      "720",
                      "HD 720",
                  ]:

                      try:

                          locator = frame.get_by_text(
                              term,
                              exact=False
                          ).first

                          if locator.is_visible(
                              timeout=1000
                          ):

                              print("")
                              print(
                                  "CLICKING QUALITY:",
                                  term
                              )

                              locator.click(
                                  timeout=5000
                              )

                              clicked_720 = True

                              page.wait_for_timeout(
                                  10000
                              )

                              break

                      except Exception:
                          pass


                  if clicked_720:
                      break


              print(
                  "UI 720 click success:",
                  clicked_720
              )


              # Wait for new network traffic.
              page.wait_for_timeout(
                  12000
              )


              # Screenshot for debugging.
              page.screenshot(
                  path="day3a-force720.png",
                  full_page=False
              )


              browser.close()


          # ========================================================
          # SAVE CAPTURED HLS URLS
          # ========================================================

          print("")
          print("======================================")
          print("ALL CAPTURED HLS URLS")
          print("======================================")


          for number, item in enumerate(
              hls_urls,
              start=1
          ):

              print("")
              print(
                  number,
                  item["source"]
              )

              print(
                  item["url"]
              )


          with open(
              "captured-hls.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  hls_urls,
                  f,
                  indent=2
              )


          if not hls_urls:

              raise SystemExit(
                  "ERROR: No HLS URLs captured"
              )

          PY

      - name: Force player to 720p and capture network
        env:
          VIDEO_URL: ${{ steps.source.outputs.url }}
        run: |
          set -e

          python force_720.py

      - name: Probe all captured Dailymotion streams
        run: |
          set -e

          python - <<'PY'

          import json
          import subprocess
          import sys


          with open(
              "captured-hls.json",
              "r",
              encoding="utf-8"
          ) as f:
              items = json.load(f)


          HEADERS = (
              "Origin: https://geo.dailymotion.com\r\n"
              "Referer: https://geo.dailymotion.com/\r\n"
              "User-Agent: Mozilla/5.0 "
              "(Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 "
              "Chrome/151 Safari/537.36\r\n"
          )


          results = []


          print("")
          print("======================================")
          print("PROBING CAPTURED STREAMS")
          print("======================================")


          for number, item in enumerate(
              items,
              start=1
          ):

              url = item["url"]


              # Ignore ad/VMAP .m3u8-looking URLs.
              if (
                  "dmxleo.dailymotion.com"
                  in url
              ):
                  continue


              print("")
              print(
                  "Testing:",
                  number
              )


              command = [
                  "ffprobe",
                  "-headers",
                  HEADERS,
                  "-v",
                  "error",
                  "-show_entries",
                  (
                      "stream="
                      "codec_type,"
                      "codec_name,"
                      "width,"
                      "height"
                  ),
                  "-of",
                  "json",
                  url,
              ]


              try:

                  process = subprocess.run(
                      command,
                      capture_output=True,
                      text=True,
                      timeout=35
                  )

              except subprocess.TimeoutExpired:

                  print(
                      "Probe timeout"
                  )

                  continue


              if process.returncode != 0:

                  print(
                      "Probe failed"
                  )

                  continue


              try:

                  probe = json.loads(
                      process.stdout
                  )

              except Exception:

                  continue


              heights = [
                  int(stream["height"])
                  for stream
                  in probe.get(
                      "streams",
                      []
                  )
                  if (
                      stream.get(
                          "codec_type"
                      )
                      == "video"
                      and
                      stream.get(
                          "height"
                      )
                  )
              ]


              if not heights:
                  continue


              height = max(
                  heights
              )


              print(
                  "REAL RESOLUTION:",
                  f"{height}p"
              )


              results.append({
                  "url": url,
                  "height": height,
                  "probe": probe,
              })


          if not results:

              print(
                  "ERROR: No usable video streams"
              )

              sys.exit(1)


          results.sort(
              key=lambda x:
                  x["height"],
              reverse=True
          )


          winner = results[0]


          print("")
          print("======================================")
          print("BEST STREAM FOUND")
          print("======================================")
          print(
              "Resolution:",
              f"{winner['height']}p"
          )


          if winner["height"] >= 720:

              print("")
              print(
                  "SUCCESS: AUTOMATIC 720P DISCOVERY WORKED"
              )

          else:

              print("")
              print(
                  "NOT YET: highest stream is",
                  f"{winner['height']}p"
              )


          with open(
              "best-url.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  winner["url"]
              )


          with open(
              "probe-results.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  results,
                  f,
                  indent=2
              )

          PY

      - name: Download 90 second best stream sample
        run: |
          set -e

          URL=$(cat best-url.txt)

          HEADERS=$'Origin: https://geo.dailymotion.com\r\nReferer: https://geo.dailymotion.com/\r\nUser-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36\r\n'

          ffmpeg \
            -y \
            -headers "$HEADERS" \
            -i "$URL" \
            -t 90 \
            -map 0:v:0 \
            -map 0:a:0? \
            -c copy \
            day3a-force720-test.mp4

      - name: Verify final sample
        run: |
          echo ""
          echo "======================================"
          echo "FINAL SAMPLE"
          echo "======================================"

          ffprobe \
            -v error \
            -show_entries \
            stream=index,codec_type,codec_name,width,height,r_frame_rate \
            -show_entries \
            format=duration,size,bit_rate \
            -of default=noprint_wrappers=1 \
            day3a-force720-test.mp4

      - name: Upload debugging files
        uses: actions/upload-artifact@v4
        with:
          name: day3a-force720-test
          path: |
            day3a-force720-test.mp4
            captured-hls.json
            probe-results.json
            day3a-force720.png
          retention-days: 1
          if-no-files-found: warn
