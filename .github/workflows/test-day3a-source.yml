name: Test Direct Day3a 720p HLS

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Test direct 720p HLS
        shell: bash
        run: |
          set -e

          URL='https://vod3.cf.dmcdn.net/sec2(62G_XEy4nbkofQN0R9lDICYerhJJ8bE-txTSNwnDkAPB5F7jXBm_RmOurbEsnIioGkCxKj1FpijCX2zUnC3cRevMRF1m4CcrpKof-AGsFMehneeChcEJ6vp3wwD735jNiCw9_4MH9hNkep-bpJgWAVlItmu2MuesKLm5u_gWF3GLg0MbO-WmfP6yJE4iZhRw)/video/417/964/231469714_mp4_h264_aac_hd_6.m3u8'

          HEADERS=$'Origin: https://geo.dailymotion.com\r\nReferer: https://geo.dailymotion.com/\r\nUser-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36\r\n'

          echo "======================================"
          echo "FFPROBE DIRECT 720P STREAM"
          echo "======================================"

          ffprobe \
            -headers "$HEADERS" \
            -v error \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            "$URL"

      - name: Download 90 second sample
        shell: bash
        run: |
          set -e

          URL='https://vod3.cf.dmcdn.net/sec2(62G_XEy4nbkofQN0R9lDICYerhJJ8bE-txTSNwnDkAPB5F7jXBm_RmOurbEsnIioGkCxKj1FpijCX2zUnC3cRevMRF1m4CcrpKof-AGsFMehneeChcEJ6vp3wwD735jNiCw9_4MH9hNkep-bpJgWAVlItmu2MuesKLm5u_gWF3GLg0MbO-WmfP6yJE4iZhRw)/video/417/964/231469714_mp4_h264_aac_hd_6.m3u8'

          HEADERS=$'Origin: https://geo.dailymotion.com\r\nReferer: https://geo.dailymotion.com/\r\nUser-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36\r\n'

          echo "======================================"
          echo "DOWNLOADING 90 SECOND 720P SAMPLE"
          echo "======================================"

          ffmpeg \
            -y \
            -headers "$HEADERS" \
            -i "$URL" \
            -t 90 \
            -map 0:v:0 \
            -map 0:a:0? \
            -c copy \
            day3a-720-test.mp4

      - name: Verify downloaded sample
        run: |
          echo "======================================"
          echo "FINAL FILE QUALITY"
          echo "======================================"

          ffprobe \
            -v error \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size,bit_rate \
            -of default=noprint_wrappers=1 \
            day3a-720-test.mp4

      - name: Upload sample
        uses: actions/upload-artifact@v4
        with:
          name: day3a-direct-720p-test
          path: day3a-720-test.mp4
          retention-days: 1
