name: Test Day3a Derived 720p URL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Playwright and FFmpeg
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install playwright

          playwright install --with-deps chromium

          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Read first episode
        id: source
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import csv
          import os
          import sys

          with open(
              "day3a_sources.csv",
              "r",
              encoding="utf-8-sig",
              newline=""
          ) as f:
              rows = list(csv.DictReader(f))

          if not rows:
              print("ERROR: CSV is empty")
              sys.exit(1)

          url = (rows[0].get("url") or "").strip()

          if not url:
              print("ERROR: First episode has no URL")
              sys.exit(1)

          print("Episode URL:")
          print(url)

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as out:
              out.write(f"url={url}\n")
          PY

      - name: Capture normal Dailymotion media URL
        env:
          VIDEO_URL: ${{ steps.source.outputs.url }}
        run: |
          cat > capture.py <<'PY'

          import os
          import time
          from playwright.sync_api import sync_playwright

          VIDEO_URL = os.environ["VIDEO_URL"]

          found = []


          def handle_request(request):

              url = request.url

              lower = url.lower()

              if (
                  "dmcdn.net" in lower
                  and
                  "_mp4_h264_aac_6.m3u8" in lower
                  and
                  "_hd_" not in lower
              ):

                  if url not in found:
                      found.append(url)

                      print("")
                      print("DIRECT LOW STREAM FOUND:")
                      print(url)


          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--autoplay-policy=no-user-gesture-required",
                      "--disable-dev-shm-usage",
                      "--no-sandbox",
                  ],
              )

              context = browser.new_context(
                  viewport={
                      "width": 1920,
                      "height": 1080,
                  },

                  user_agent=(
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/151.0.0.0 "
                      "Safari/537.36"
                  ),
              )

              context.on(
                  "request",
                  handle_request
              )

              page = context.new_page()

              page.goto(
                  VIDEO_URL,
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              page.wait_for_timeout(10000)

              try:

                  page.evaluate(
                      """
                      () => {
                          document
                              .querySelectorAll('video')
                              .forEach(video => {
                                  video.muted = true;
                                  video.play().catch(() => {});
                              });
                      }
                      """
                  )

              except Exception:
                  pass

              page.wait_for_timeout(15000)

              browser.close()


          if not found:

              raise SystemExit(
                  "ERROR: Could not capture low Dailymotion HLS URL"
              )


          with open(
              "low-url.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(found[-1])

          PY

          python capture.py

      - name: Construct HD URL
        run: |
          set -e

          python - <<'PY'

          with open(
              "low-url.txt",
              "r",
              encoding="utf-8"
          ) as f:
              low = f.read().strip()


          target = "_mp4_h264_aac_6.m3u8"

          replacement = "_mp4_h264_aac_hd_6.m3u8"


          if target not in low:

              raise SystemExit(
                  "ERROR: Expected low-quality filename not found"
              )


          hd = low.replace(
              target,
              replacement
          )


          print("")
          print("======================================")
          print("LOW URL")
          print("======================================")
          print(low)

          print("")
          print("======================================")
          print("DERIVED HD URL")
          print("======================================")
          print(hd)


          with open(
              "hd-url.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(hd)

          PY

      - name: Probe original low stream
        run: |
          set -e

          URL=$(cat low-url.txt)

          HEADERS=$'Origin: https://geo.dailymotion.com\r\nReferer: https://geo.dailymotion.com/\r\nUser-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36\r\n'

          echo ""
          echo "======================================"
          echo "ORIGINAL STREAM"
          echo "======================================"

          ffprobe \
            -headers "$HEADERS" \
            -v error \
            -show_entries \
            stream=codec_type,codec_name,width,height \
            -of default=noprint_wrappers=1 \
            "$URL"

      - name: Probe derived HD stream
        id: hdtest
        shell: bash
        run: |
          set +e

          URL=$(cat hd-url.txt)

          HEADERS=$'Origin: https://geo.dailymotion.com\r\nReferer: https://geo.dailymotion.com/\r\nUser-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36\r\n'

          echo ""
          echo "======================================"
          echo "TESTING DERIVED HD STREAM"
          echo "======================================"

          ffprobe \
            -headers "$HEADERS" \
            -v error \
            -show_entries \
            stream=codec_type,codec_name,width,height \
            -of default=noprint_wrappers=1 \
            "$URL" \
            > hd-probe.txt \
            2> hd-error.txt

          STATUS=$?

          echo ""
          echo "FFPROBE EXIT CODE:"
          echo "$STATUS"

          echo ""
          echo "PROBE OUTPUT:"
          cat hd-probe.txt

          echo ""
          echo "ERROR OUTPUT:"
          cat hd-error.txt

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          exit 0

      - name: Evaluate HD result
        run: |
          python - <<'PY'

          import os
          import re
          import sys


          probe = ""

          if os.path.exists(
              "hd-probe.txt"
          ):

              with open(
                  "hd-probe.txt",
                  "r",
                  encoding="utf-8"
              ) as f:
                  probe = f.read()


          match = re.search(
              r"height=(\d+)",
              probe
          )


          print("")
          print("======================================")
          print("RESULT")
          print("======================================")


          if not match:

              print(
                  "DERIVED HD URL DID NOT WORK."
              )

              print("")
              print(
                  "This probably means the sec2 token "
                  "is signed separately for each quality."
              )

              sys.exit(0)


          height = int(
              match.group(1)
          )


          print(
              "Derived stream height:",
              height
          )


          if height >= 720:

              print("")
              print(
                  "SUCCESS: AUTOMATIC 720P URL DERIVATION WORKS"
              )

          else:

              print("")
              print(
                  "Derived URL responded, but it was not 720p."
              )

          PY

      - name: Download 90 second HD sample if available
        if: steps.hdtest.outputs.status == '0'
        run: |
          set -e

          URL=$(cat hd-url.txt)

          HEADERS=$'Origin: https://geo.dailymotion.com\r\nReferer: https://geo.dailymotion.com/\r\nUser-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36\r\n'

          ffmpeg \
            -y \
            -headers "$HEADERS" \
            -i "$URL" \
            -t 90 \
            -map 0:v:0 \
            -map 0:a:0? \
            -c copy \
            day3a-derived-hd.mp4

      - name: Verify sample
        if: steps.hdtest.outputs.status == '0'
        run: |
          echo ""
          echo "======================================"
          echo "FINAL SAMPLE"
          echo "======================================"

          ffprobe \
            -v error \
            -show_entries \
            stream=codec_type,codec_name,width,height,r_frame_rate \
            -show_entries \
            format=duration,size,bit_rate \
            -of default=noprint_wrappers=1 \
            day3a-derived-hd.mp4

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: day3a-derived-hd-test
          path: |
            low-url.txt
            hd-url.txt
            hd-probe.txt
            hd-error.txt
            day3a-derived-hd.mp4
          retention-days: 1
          if-no-files-found: warn
