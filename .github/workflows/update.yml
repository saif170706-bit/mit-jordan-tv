name: Auto Refresh IPTV Redirects

on:
  schedule:
    # True 40-minute sequence:
    #
    # 00:10
    # 00:50
    # 01:30
    # 02:10
    # 02:50
    # 03:30
    # etc.

    - cron: "10 */2 * * *"
    - cron: "50 */2 * * *"
    - cron: "30 1-23/2 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iptv-stream-refresh
  cancel-in-progress: false

jobs:
  refresh-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chrome and ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: true

      - name: Show browser versions
        run: |
          echo "Chrome:"
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version

          echo "ChromeDriver:"
          "${{ steps.setup-chrome.outputs.chromedriver-path }}" --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Find fresh streams and update redirects
        env:
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}

          WORKER_UPDATE_URL: ${{ secrets.WORKER_UPDATE_URL }}
          WORKER_UPDATE_SECRET: ${{ secrets.WORKER_UPDATE_SECRET }}

        run: |
          python updater.py

      - name: Check Worker health
        if: always()
        env:
          WORKER_UPDATE_URL: ${{ secrets.WORKER_UPDATE_URL }}

        run: |
          BASE_URL="${WORKER_UPDATE_URL%/update}"

          echo "Checking Worker health..."

          curl \
            --fail \
            --silent \
            --show-error \
            "$BASE_URL/health"

          echo
